<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Nos recettes</title>
  <link rel="stylesheet" href="./css/adm_recipes.css">
</head>
<body>

  <h1>Ajouter une recette</h1>

  <form id="recipe-form">
    <div class="section">
      <label>Titre : <input type="text" name="title" required /></label><br>
      <label>Temps de préparation (en minutes) :
        <input type="number" name="preparation_time" required />
      </label><br>
      <label>Difficulté (1 à 5) :
        <input type="number" name="difficulty" min="1" max="5" required />
      </label><br>
    </div>

    <div class="section">
      <h3>Ingrédients</h3>
      <div id="ingredients" class="ingredients"></div>
      <button type="button" onclick="addIngredient()">+ Ajouter un ingrédient</button>
    </div>

    <div class="section">
      <h3>Étapes</h3>
      <div id="steps" class="steps"></div>
      <button type="button" onclick="addStep()">+ Ajouter une étape</button>
    </div>

    <div class="section">
      <h3>Image</h3>
      <input type="file" id="image-upload" accept="image/*" />
    </div>

    <button type="submit">✅ Enregistrer la recette</button>
  </form>

  <datalist id="ingredients-list"></datalist>

  <!-- Importation du fichier JavaScript -->
   <script src="scripts/check_user_role.js"></script>
  <script type="module" src="scripts/add_recipe.js"></script>

</body>
</html>
