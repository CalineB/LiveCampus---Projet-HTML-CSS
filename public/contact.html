<html lang="fr">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/navbar_footer.css">
    <link rel="stylesheet" href="css/contact.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="images/logoME.png" alt="logo - Mélange d'épices" class="logo">
        </a>
    </header>

    <nav>
        <i class='burger_menu bx bx-menu-alt-right' style='color:#ffcc00'></i>
        <ul class="navbar">
            <li class="nav_btn"><a href="index.html" class="navigation">Accueil</a></li>
            <li class="nav_btn"><a href="products.html" class="navigation">Nos produits</a></li>
            <li class="nav_btn"><a href="contact.html" class="navigation">Contact</a></li>
        </ul>
    </nav>
    
<main>
    <div class="contact">
    <aside>
        <ul class="side-menu">
            <li class="address_info title">Mélange d'épices</li>
            <li class="address_info">
                51 Rue de Lyon
                <br>
                89200 AVALLON
            </li>
            <li class="address_info">
                Du mardi au vendredi <br> 9h00 - 12h00 <br> 15h00 - 19h00
                <br> <br>
                Les samedis <br> 8h30 - 12h30 <br> 15h00 - 20h00
            </li>
            <li class="address_info">
                an-entreprise@orange.fr
            </li>
        </ul>
    </aside>

    <form method="POST" class="contact-form" name="contact" data-netlify="true">
        <h2>Ecrivez-nous !</h2>
        <div class="formulaire">
            <label for="name">Nom et Prénom</label>
            <input type="text" id="nom" name="nom" placeholder="BON Jean" required>
        </div>

        <div class="formulaire">
            <label for="email">Courriel</label>
            <input type="email" id="mail" name="mail" placeholder="votremail@email.com" required>
        </div>

        <div class="formulaire">
            <label for="tel">Téléphone</label>
            <input type="text" id="telephone" name="telephone" placeholder="07 07 07 07 07">
        </div>

        <div class="formulaire">
            <label for="message">Votre message</label>
            <textarea id="message" name="message" placeholder="Votre message" required></textarea>
        </div>

        <button type="submit" class="btn-submit">
            Envoyer votre message
        </button>
    </form>
</div>
</main>


<footer>
    <a href="contact.html"><p class="footer_text">Contact</p></a>
    <a href="legal_info.html"><p class="footer_text">Mentions légales</p></a>
    <a href="https://calineb.netlify.app/" target="_blank"><p class="footer_text">Par CBO@2025</p></a>
</footer>


<script src="scripts/dropdown.js"></script>
<script src="scripts/navbar.js"></script>

</body>
